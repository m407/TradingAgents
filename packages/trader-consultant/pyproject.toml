[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-consultant"
version = "0.1.0"
description = "Portfolio rebalance drafts for human review from TradingAgents recommendations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.7,<3", "numpy>=1.26,<3", "scipy>=1.12,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16", "langchain-core>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
