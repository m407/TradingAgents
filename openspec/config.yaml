schema: spec-driven
#context: |
#  Consult openwiki
rules:
  design:
    - >-
      Пиши на русском языке. Английский используй только для точных имён
      сущностей, идентификаторов, кода и устоявшихся технических терминов;
      неоднозначный термин при первом употреблении кратко поясняй по-русски.
    - Review resulting design with @external-expert agent
  proposal:
    - >-
      Пиши на русском языке. Английский используй только для точных имён
      сущностей, идентификаторов, кода и устоявшихся технических терминов;
      неоднозначный термин при первом употреблении кратко поясняй по-русски.
    - Review resulting proposal with @external-expert agent
  specs:
    - >-
      Пиши на русском языке. Английский используй только для точных имён
      сущностей, идентификаторов, кода и устоявшихся технических терминов;
      неоднозначный термин при первом употреблении кратко поясняй по-русски.
    - Reference existing patterns before inventing new ones
    - Suggest relevant skills to use
    - Review resulting specs with @external-expert agent
  tasks:
    - >-
      Пиши описания задач и проверки на русском языке. Английский используй
      только для точных имён сущностей, идентификаторов, кода, команд и
      устоявшихся технических терминов; неоднозначный термин при первом
      употреблении кратко поясняй по-русски.
    - >-
      Каждая задача должна сохранять совместимый с OpenSpec checkbox и иметь
      одну строку формата: `- [ ] X.Y [agent=missing;
      depends-on=<ids|none>; parallel=<yes|no>] <description>. Verification:
      <command or observable result>.` Verification должна находиться в той же
      checkbox-строке.
    - |
      Декомпозируй работу по независимым изменяемым компонентам и authority
      boundaries. Не объединяй в одну задачу изменения, которые могут быть
      выполнены независимо. Одна задача должна быть выполнима одним узким
      task-specific агентом за одну сессию.
    - |
      parallel=yes допускается только при отсутствии общих изменяемых файлов,
      зависимостей по данным, миграциям или generated artifacts. Всегда
      указывай реальные prerequisite task IDs в depends-on; не создавай
      искусственные зависимости между независимыми задачами.
    - Каждая задача должна содержать собственный способ проверки завершения
    - Каждая выполненная задача должна пройти scope-only review через external-expert перед установкой checkbox
operations:
  apply:
    guidance:
      - |
        Не выполняй pending задачу с agent=missing. Сначала запусти
        `/prepare-task-agents <change-name>`, затем перечитай tasks.md и
        используй точное назначенное имя агента.
      - |
        Делегируй каждую pending задачу указанному agent через Task tool, если
        он доступен. Не подменяй специализированного исполнителя основным
        агентом без явного объяснения причины.
      - |
        Соблюдай depends-on и parallel. Параллельно запускай только независимые
        задачи с parallel=yes.
      - |
        После выполнения задачи вызови @external-expert для scope-only review и
        устанавливай checkbox только после успешной проверки.
